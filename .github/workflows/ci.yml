name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Testes headless (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Baixar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o SHA512-SUMS.txt "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/SHA512-SUMS.txt"
          mv godot.zip "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          grep " Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c -
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          rm godot.zip

      - name: Validar áudio e fases gerados
        run: |
          python3 tools/make_levels.py
          git diff --exit-code data/levels.json || (echo "data/levels.json desatualizado: rode tools/make_levels.py" && exit 1)

      - name: Importar projeto
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then exit 1; fi

      - name: Compilar todos os scripts
        run: |
          timeout 120 ~/godot/godot --headless --path . res://tests/check_scripts.tscn 2>&1 | tee check.log
          grep -q "0 com erro" check.log

      - name: Rodar testes
        run: |
          set -o pipefail
          timeout 900 ~/godot/godot --headless --fixed-fps 60 --path . res://tests/test_runner.tscn 2>&1 | tee test.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Invalid assignment" test.log; then
            echo "::error::Erros de script durante os testes"
            exit 1
          fi

      - name: Loja simulada, persistência e bloqueio de produção
        run: |
          set -o pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/guardipatas-store-tests"
          mkdir -p "$XDG_DATA_HOME"
          timeout 120 ~/godot/godot --headless --path . res://tests/store_test.tscn -- --test-io 2>&1 | tee store.log
          timeout 120 ~/godot/godot --headless --path . res://tests/store_test.tscn -- --store-production 2>&1 | tee store-production.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" store.log store-production.log; then exit 1; fi

      - name: Cuidados na Casinha
        run: |
          set -o pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/guardipatas-care-tests"
          mkdir -p "$XDG_DATA_HOME"
          timeout 120 ~/godot/godot --headless --path . res://tests/pet_care_test.tscn -- --test-io 2>&1 | tee care.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" care.log; then exit 1; fi

      - name: Teste de fluxo da interface
        run: |
          set -o pipefail
          timeout 300 ~/godot/godot --headless --fixed-fps 60 --path . res://tests/flow_test.tscn 2>&1 | tee flow.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" flow.log; then exit 1; fi

      - name: Smoke test do jogo (abre o menu e roda 10 s)
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 --path . --quit-after 600 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" smoke.log; then exit 1; fi

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
